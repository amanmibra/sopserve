<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sopserve</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --sunk: #eef1f4; --ink: #1b2230; --muted: #5e6878; --line: #dde1e7; --line-strong: #c5ccd6;
    --accent: #0f6e6a; --accent-soft: #e2f1ef; --accent-ink: #ffffff;
    --ok: #2e7d4f; --warn: #a15c07; --warn-soft: #fbf0df; --err: #b42318; --err-soft: #fbe9e7;
    --radius: 8px; --focus: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --panel: #1a2028; --sunk: #151a21; --ink: #e6eaf0; --muted: #93a0b0; --line: #2a323d; --line-strong: #3a4552;
      --accent: #4fc1b9; --accent-soft: #173431; --accent-ink: #0d1a19;
      --ok: #6cc597; --warn: #e6a94f; --warn-soft: #2f2616; --err: #f08a7e; --err-soft: #35201e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --panel: #1a2028; --sunk: #151a21; --ink: #e6eaf0; --muted: #93a0b0; --line: #2a323d; --line-strong: #3a4552;
    --accent: #4fc1b9; --accent-soft: #173431; --accent-ink: #0d1a19;
    --ok: #6cc597; --warn: #e6a94f; --warn-soft: #2f2616; --err: #f08a7e; --err-soft: #35201e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: none; box-shadow: var(--focus); }

  /* frame */
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  .brand { font-weight: 650; font-size: 15px; letter-spacing: -.01em; margin-right: 6px; }
  .spacer { flex: 1; }
  .shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: calc(100vh - 55px); }
  nav.rail { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px 40px; position: sticky; top: 55px; height: calc(100vh - 55px); overflow: auto; }
  main { padding: 24px 32px 40px; min-width: 0; }
  .page { max-width: 860px; }
  .page.wide { max-width: 1320px; }

  /* rail */
  .rail-group { margin-bottom: 18px; }
  .rail-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 4px; }
  .rail-head h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--muted); }
  .rail a.item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; min-width: 0; }
  .rail a.item:hover { background: var(--sunk); }
  .rail a.item.active { background: var(--accent-soft); }
  .rail a.item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail .empty { padding: 2px 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
  .dot.deleted { background: var(--err); }

  /* controls */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--sunk); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 550; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--err); }
  .btn.small { padding: 2px 8px; font-size: 13px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); background: var(--sunk); }
  .btn:disabled { opacity: .45; cursor: default; filter: none; }
  .icon-btn { width: 28px; height: 28px; padding: 0; justify-content: center; border-color: transparent; background: transparent; color: var(--muted); }
  .icon-btn:hover:not(:disabled) { background: var(--sunk); color: var(--ink); }
  .count { background: var(--warn); color: var(--panel); border-radius: 10px; padding: 0 7px; font-size: 12px; font-weight: 650; }
  input:not([type]), input[type=text], select, textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); }
  input[readonly] { background: var(--sunk); color: var(--muted); }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  textarea.tall { min-height: 200px; }
  .top select, .top input { width: auto; }
  label.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: var(--line-strong); border-radius: 20px; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; background: var(--panel); border-radius: 50%; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { box-shadow: var(--focus); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; flex-wrap: wrap; }
  .seg button { border: 0; background: var(--panel); padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }

  /* page parts */
  .crumb { font-size: 13px; margin-bottom: 2px; }
  .crumb a { color: var(--muted); }
  h1 { font-size: 22px; line-height: 1.25; margin: 0; letter-spacing: -.015em; font-weight: 650; }
  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .sub { color: var(--muted); margin: 4px 0 18px; max-width: 75ch; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 12px 0 22px; }
  .tabs a { padding: 8px 12px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a.on { color: var(--ink); border-color: var(--accent); font-weight: 550; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; text-decoration: none; }
  .tag.changed, .tag.added, .tag.edited { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .tag.removed, .tag.deleted { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .tag.live { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  .form { display: grid; gap: 24px; }
  .field > .name { display: block; font-weight: 600; margin-bottom: 2px; }
  .field > .help { color: var(--muted); font-size: 13px; margin: 0 0 8px; max-width: 72ch; }
  .field.bad > input, .field.bad > textarea, .field.bad > select, .row.bad input:not([type=checkbox]) { border-color: var(--err); }
  .ferr { color: var(--err); font-size: 13px; margin-top: 6px; }
  .fwarn { color: var(--warn); font-size: 13px; margin-top: 6px; }
  .pair { display: grid; grid-template-columns: 200px 1fr; gap: 12px; }

  /* lists of rows */
  .rows { display: grid; gap: 6px; }
  .row { display: grid; gap: 6px; align-items: center; }
  .row.steps { grid-template-columns: 26px 1fr 170px auto auto; }
  .row.items { grid-template-columns: 1fr 170px auto; }
  .row.vars { grid-template-columns: minmax(120px, 220px) 1fr auto; }
  .row .num { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .row .ops { display: flex; }
  .row .ferr { grid-column: 1 / -1; margin: 0 0 4px; }
  .row.steps .ferr { grid-column: 2 / -1; }
  .addrow { margin-top: 8px; }

  .picker { display: grid; gap: 6px; justify-items: start; }
  .picked { display: flex; flex-wrap: wrap; gap: 6px; }
  .picked.ordered { display: grid; gap: 4px; justify-self: stretch; max-width: 520px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border-radius: 16px; background: var(--sunk); border: 1px solid var(--line); }
  .picked.ordered .chip { border-radius: var(--radius); padding: 3px 4px 3px 10px; justify-content: space-between; }
  .chip .x { width: 24px; height: 24px; }
  .chip .muted { margin-left: 6px; font-size: 13px; }
  .picker select { width: auto; min-width: 220px; }
  .note { color: var(--muted); font-size: 13px; }
  .muted { color: var(--muted); }

  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: sticky; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); padding: 12px 0; margin-top: 26px; border-top: 1px solid var(--line); }
  .actions input { max-width: 320px; }
  .banner { padding: 10px 14px; border-radius: var(--radius); margin: 0 0 16px; background: var(--sunk); border: 1px solid var(--line); }
  .banner.ok { background: var(--accent-soft); border-color: transparent; }
  .banner.err { background: var(--err-soft); border-color: transparent; }
  .banner.warn { background: var(--warn-soft); border-color: transparent; }
  .banner ul { margin: 6px 0 0; padding-left: 18px; }
  .banner a { color: inherit; font-weight: 600; }

  table.list { width: 100%; border-collapse: collapse; }
  table.list td, table.list th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.list th { font-weight: 600; color: var(--muted); font-size: 13px; }
  table.list tr.click { cursor: pointer; }
  table.list tr.click:hover td, table.list tr.on td { background: var(--sunk); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 16px; margin: 0 0 8px; }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .prompt { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
  .prompt header { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .prompt header b { margin-right: auto; }
  .prompt pre { margin: 0; padding: 14px; white-space: pre-wrap; word-break: break-word; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 70vh; overflow: auto; }
  .parts { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--sunk); }
  .parts .tag { background: var(--panel); color: var(--ink); }
  .history { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
  /* diffs */
  .dv-wrap { margin: 8px 0; }
  .dv-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .seg.small button { padding: 3px 10px; font-size: 13px; }
  .counts { font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
  .c-add { color: var(--ok); } .c-del { color: var(--err); } .c-mod { color: var(--warn); }
  .dv { font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: 75vh; }
  .dl { display: grid; grid-template-columns: 42px 42px 18px minmax(0, 1fr); }
  .dl.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .dh { display: grid; grid-template-columns: 42px 18px minmax(0, 1fr); min-width: 0; }
  .dh + .dh { border-left: 1px solid var(--line); }
  .ln { color: var(--muted); opacity: .7; text-align: right; padding-right: 8px; user-select: none; font-size: 11.5px; }
  .sg { user-select: none; text-align: center; color: var(--muted); }
  .tx { white-space: pre-wrap; word-break: break-word; padding-right: 12px; }
  .dl.add, .dh.add { background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .dl.del, .dh.del { background: color-mix(in srgb, var(--err) 11%, transparent); }
  .dl.add .sg, .dh.add .sg { color: var(--ok); } .dl.del .sg, .dh.del .sg { color: var(--err); }
  .dh.pad { background: var(--sunk); }
  mark.wadd { background: color-mix(in srgb, var(--ok) 38%, transparent); color: inherit; border-radius: 2px; }
  mark.wdel { background: color-mix(in srgb, var(--err) 34%, transparent); color: inherit; border-radius: 2px; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--err) 60%, transparent); }
  .dv-fold { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--sunk); color: var(--accent); padding: 3px 12px 3px 102px; cursor: pointer; font: 12.5px/1.6 system-ui, sans-serif; }
  .dv.split .dv-fold { padding-left: 60px; }
  .dv-fold:hover { text-decoration: underline; }
  details.change { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  details.change > summary { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; list-style: none; flex-wrap: wrap; }
  details.change > summary::-webkit-details-marker { display: none; }
  details.change > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  details.change[open] > summary::before { transform: rotate(90deg); }
  .change-body { padding: 0 14px 14px; }
  .section-title { font-size: 16px; margin: 26px 0 10px; }
  .tag.big { font-size: 13px; padding: 2px 10px; font-weight: 600; }
  .top-actions { position: static; border-top: 0; padding: 0 0 6px; margin: 0; background: none; backdrop-filter: none; }
  ul.fchanges { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .fc-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .chg { font-size: 13px; padding: 0 6px; border-radius: 6px; background: var(--sunk); }
  .beforeafter { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-top: 4px; }
  .was { background: color-mix(in srgb, var(--err) 11%, transparent); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--err) 55%, transparent); padding: 0 5px; border-radius: 4px; white-space: pre-wrap; }
  .now { background: color-mix(in srgb, var(--ok) 13%, transparent); padding: 0 5px; border-radius: 4px; white-space: pre-wrap; }
  .arrow { color: var(--muted); }
  table.kv td { padding: 2px 8px 2px 0; vertical-align: top; }
  pre.plain { margin: 6px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--sunk); white-space: pre-wrap; word-break: break-word; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre.plain.add { background: color-mix(in srgb, var(--ok) 11%, transparent); }
  pre.plain.del { background: color-mix(in srgb, var(--err) 9%, transparent); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--err) 45%, transparent); }
  .built { display: grid; gap: 6px; margin-bottom: 8px; }
  .built > div { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .built .parts { border: 0; padding: 0; background: none; }
  h3.minor { font-size: 14px; margin: 20px 0 4px; }
  .empty-state { padding: 40px 0; max-width: 60ch; }
  .empty-state h1 { margin-bottom: 8px; }
  .hidden { display: none !important; }

  /* blocks: type badges, cards, the library */
  :root { --c-instruction: #2f5fb3; --c-procedure: #7a3fb0; --c-group: #a15c07; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-instruction: #86aef2; --c-procedure: #c7a0f2; --c-group: #e6a94f; } }
  :root[data-theme="dark"] { --c-instruction: #86aef2; --c-procedure: #c7a0f2; --c-group: #e6a94f; }
  .badge { display: inline-block; font-size: 11px; font-weight: 650; letter-spacing: .02em; text-transform: uppercase; padding: 1px 7px; border-radius: 5px; white-space: nowrap; flex: none; }
  .b-instruction { color: var(--c-instruction); background: color-mix(in srgb, var(--c-instruction) 13%, transparent); }
  .b-procedure { color: var(--c-procedure); background: color-mix(in srgb, var(--c-procedure) 13%, transparent); }
  .b-group { color: var(--c-group); background: color-mix(in srgb, var(--c-group) 15%, transparent); }
  .b-missing { color: var(--err); background: var(--err-soft); }
  .lock { font-size: 11px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 5px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
  .lock.big { font-size: 12px; padding: 1px 8px; margin-left: 0; }
  .stack { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .form > .field { min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .card.bad { border-color: var(--err); }
  .card.dragging { opacity: .5; }
  .card.drop-before { box-shadow: 0 -3px 0 var(--accent); }
  .card.drop-after { box-shadow: 0 3px 0 var(--accent); }
  .card > .ferr { padding: 0 12px 8px 64px; margin: 0; }
  .card-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 8px; min-width: 0; }
  .grip { cursor: grab; color: var(--muted); user-select: none; font-size: 15px; }
  .pos { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 14px; text-align: right; }
  .card-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px; background: none; border: 0; padding: 4px 2px; text-align: left; cursor: pointer; border-radius: 6px; }
  .card-title:hover b { text-decoration: underline; }
  .card-title b { white-space: nowrap; }
  .card-sub { color: var(--muted); font-size: 13px; margin-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .card .ops { display: flex; align-items: center; flex: none; }
  .card-body { padding: 0 12px 12px 64px; }
  .card-body pre.plain { margin: 0; max-height: 320px; overflow: auto; }
  ol.members { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  .library { margin-top: 8px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel); padding: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, .08); }
  .lib-top { display: flex; gap: 8px; align-items: center; }
  .lib-results { max-height: 320px; overflow: auto; margin-top: 8px; }
  .lib-head { font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 6px 2px; }
  .lib-item { display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px; background: none; border: 0; border-radius: 6px; cursor: pointer; text-align: left; }
  .lib-item:hover:not(:disabled) { background: var(--sunk); }
  .lib-item:disabled { cursor: default; opacity: .55; }
  .lib-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-new { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; }
  .quick { margin-top: 8px; }
  .quick label .name { display: block; font-weight: 600; margin-bottom: 2px; }
  .usedby { margin: -8px 0 18px; color: var(--ink); }

  /* the agent builder */
  .builder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .builder > * { min-width: 0; }
  .builder .form { grid-template-columns: minmax(0, 1fr); }
  .builder .side { position: sticky; top: 72px; }
  .preview pre { max-height: calc(100vh - 170px); }
  .preview .pad { padding: 12px 14px; }
  .preview .dv { max-height: calc(100vh - 220px); }
  .pair3 { display: grid; grid-template-columns: 1fr 160px 1fr; gap: 12px; align-items: end; }
  .row.vars { grid-template-columns: minmax(120px, 220px) 1fr 28px; }
  .row.vars .varfrom { grid-column: 2 / -1; margin-top: -4px; }
  .row.vars .varfrom:empty { display: none; }
  .varname { overflow: hidden; text-overflow: ellipsis; }
  .varname code { font-size: 13px; }

  /* overview matrix */
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(680px, calc(100vw - 32px)); z-index: 20; }
  .toast .banner { margin: 0; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); border: 1px solid var(--line-strong); }
  .toast .banner.ok { background: var(--panel); }
  .matrix-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  table.matrix { border-collapse: collapse; min-width: 100%; }
  table.matrix th, table.matrix td { border-bottom: 1px solid var(--line); padding: 0; }
  table.matrix thead th { position: sticky; top: 0; background: var(--panel); font-size: 13px; font-weight: 600; padding: 10px 8px; text-align: center; white-space: nowrap; }
  table.matrix tbody th { text-align: left; font-weight: 500; padding: 6px 12px; white-space: nowrap; }
  table.matrix tr.msec th { background: var(--sunk); color: var(--muted); font-size: 12px; font-weight: 600; padding: 6px 12px; }
  table.matrix td { text-align: center; border-left: 1px solid var(--line); min-width: 110px; }

<script>
"use strict";
// ---------------------------------------------------------------------------------
// helpers
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...kids) {

}
const local = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
};
const clone = (x) => JSON.parse(JSON.stringify(x));
const when = (t) => t ? new Date(t).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";
const slug = (s) => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 100);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

const KIND = {
  agent: { one: "Agent", many: "Agents", route: "agents", list: "agents", api: "agents" },
  instruction: { one: "Shared instruction", many: "Shared instructions", route: "instructions", list: "instructions", api: "instructions", badge: "instruction" },
  procedure: { one: "Procedure", many: "Procedures", route: "procedures", list: "procedures", api: "procedures", badge: "procedure" },
  group: { one: "Group", many: "Groups", route: "groups", list: "groups", api: "groups", badge: "group" },
  settings: { one: "Settings", many: "Settings", route: "settings", list: null, api: null },
};
const BLOCK_KINDS = ["group", "instruction", "procedure"];
const PLATFORMS = [["livekit", "LiveKit", "Agent name"], ["vapi", "Vapi", "Assistant ID"], ["elevenlabs", "ElevenLabs", "Agent ID"], ["retell", "Retell", "Agent ID"]];
const platformName = (p) => (PLATFORMS.find((x) => x[0] === p) || [p, p])[1];
const DELIVERY = [
  ["prompt", "Whole procedure in the prompt", "Everything goes in the agent's prompt. Use this unless the agent has a get_sop tool."],
  ["auto", "Rules in the prompt, steps on request", "The name, when it applies, never and warning signs stay in the prompt. The goal, guidance and steps are fetched with the agent's get_sop tool."],
  ["tool", "Only the name in the prompt, the rest on request", "The prompt names the procedure and when it applies. Everything else is fetched with the agent's get_sop tool."],
];
const LOCK_HELP = "Every agent must include it, directly or through a group. Saving fails if one doesn't.";

// ---------------------------------------------------------------------------------
// state and API
const S = { ws: local.get("sopserve.ws") || "", workspaces: [], cfg: null, draft: null, releases: [], releaseCache: {}, form: null, flash: null, legacy: null };
const EMPTY_CFG = { settings: { variables: {}, procedures_heading: "## Procedures" }, agents: [], instructions: [], procedures: [], groups: [] };

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = (res.headers.get("content-type") || "").includes("json") ? await res.json() : await res.text();

    const err = new Error(typeof detail === "string" ? detail.charAt(0).toUpperCase() + detail.slice(1) + "." : Array.isArray(detail) ? "Some values are missing or have the wrong type." : `The server answered ${res.status}.`);

}
const wsUrl = (p = "") => `/v1/workspaces/${encodeURIComponent(S.ws)}${p}`;
const author = () => $("author").value.trim() || null;

async function loadAll() {
  const [cfg, draft, releases] = await Promise.all([
    api("GET", wsUrl("/config")).catch((e) => {
      if (e.status === 422 && ((e.data && e.data.issues) || []).some((i) => i.code === "old_format")) return null;
      throw e;
    }),
    api("GET", wsUrl("/draft")), api("GET", wsUrl("/releases"))]);

  S.cfg = cfg || clone(EMPTY_CFG); S.draft = draft; S.releases = releases;
}
async function liveRelease() {
  const n = S.draft && S.draft.release;
  if (!n) return null;
  if (!S.releaseCache[n]) S.releaseCache[n] = await api("GET", wsUrl(`/releases/${n}`));
  return S.releaseCache[n];
}
// What kind a block id is: "instruction", "procedure", "group", or null if nothing has that name.
function blockKind(id) {
  for (const k of BLOCK_KINDS) if (S.cfg[KIND[k].list].some((x) => x.id === id)) return k;
  return null;
}
const findItem = (kind, id) => kind === "settings" ? S.cfg.settings : (S.cfg[KIND[kind].list] || []).find((x) => x.id === id);
function itemName(kind, id) {
  if (kind === "settings" || kind === "config") return "Settings";
  if (kind === "procedure" || kind === "sop") { const p = S.cfg && S.cfg.procedures.find((x) => x.id === id); return p ? p.name : id; }
  return id;
}
const blockName = (id) => itemName(blockKind(id) || "instruction", id);
const itemHref = (kind, id) => kind === "settings" ? "#/settings" : `#/${KIND[kind].route}/${encodeURIComponent(id)}`;
const changeOf = (kind, id) => S.draft && S.draft.items.find((i) => i.kind === kind && i.id === id);
const kindOfComponent = (k) => ({ agent: "agent", instruction: "instruction", base: "instruction", sop: "procedure", config: "settings" }[k]);

// An agent's blocks with groups expanded: [{id, via}] (via: the group the agent lists, or null).
function expandBlocks(blocks, via = null, seen = new Set()) {
  const out = [];
  for (const b of blocks) {
    const g = S.cfg.groups.find((x) => x.id === b);
    if (g) { if (!seen.has(b)) out.push(...expandBlocks(g.blocks, via || b, new Set([...seen, b]))); }
    else out.push({ id: b, via });
  }
  return out;
}
// Every {{placeholder}} in some text.
const placeholders = (t) => [...String(t || "").matchAll(/\{\{\s*([A-Za-z0-9_.-]+)\s*\}\}/g)].map((m) => m[1]);
function blockText(id) {
  const k = blockKind(id), it = k && findItem(k, id);
  if (!it) return "";
  if (k === "instruction") return it.text;
  if (k === "procedure") return [it.name, it.goal, it.when, it.guidance, ...[...it.steps, ...it.never, ...it.warning_signs].map((s) => s.text)].join("\n");
  return "";
}
// Variables an agent's context and blocks use, with the blocks that use each: [[name, [ids]]].
function neededVariables(model) {
  const need = new Map();
  const add = (name, from) => { if (!need.has(name)) need.set(name, []); if (!need.get(name).includes(from)) need.get(name).push(from); };
  placeholders(model.context).forEach((n) => add(n, "About this agent"));
  for (const { id } of expandBlocks(model.blocks)) placeholders(blockText(id)).forEach((n) => add(n, blockName(id)));
  return [...need.entries()];
}

// ---------------------------------------------------------------------------------
// routing: #/overview, #/agents/<id>[/prompt|/history], #/instructions/<id>, #/procedures/<id>, #/groups/<id>, #/settings, #/changes, #/releases/<n>
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (parts[0] === "shared") parts[0] = "instructions"; // links from before groups
  return { section: parts[0] || "", id: parts[1] || "", tab: parts[2] || "" };
}
function go(...parts) {
  const hash = "#/" + parts.filter((p) => p !== undefined && p !== "").map((p) => encodeURIComponent(p)).join("/");
  if (location.hash === hash) render(); else location.hash = hash;
}

  if (S.form && S.form.dirty && S.form.hash !== location.hash) {
    const target = location.hash;
    history.replaceState(null, "", S.form.hash);
    const bar = $("leave-bar");
    if (bar) {
      bar.classList.remove("hidden");
      bar.querySelector("[data-leave]").onclick = () => { S.form.dirty = false; location.hash = target; };
      bar.scrollIntoView({ block: "nearest" });

  }

});

// ---------------------------------------------------------------------------------
// frame
function renderTop() {
  const names = S.workspaces.map((w) => w.workspace);
  if (S.ws && !names.includes(S.ws)) names.push(S.ws);
  $("ws").replaceChildren(...(names.length ? names.map((n) => el("option", { value: n, selected: n === S.ws }, n)) : [el("option", { value: "" }, "No workspaces yet")]));
  const n = S.draft ? S.draft.items.length : 0;
  $("changes-btn").replaceChildren("Unpublished changes", n ? el("span", { class: "count", "aria-label": `${n} changes` }, n) : "");
}

function renderRail() {
  const r = route();
  if (!S.cfg) { $("rail").replaceChildren(); return; }
  const cur = "#/" + r.section + (r.id && !["settings", "releases", "overview"].includes(r.section) ? "/" + encodeURIComponent(r.id) : "");
  const link = (href, label, kind, id, extra) => {
    const c = kind && changeOf(kind, id);
    return el("a", { class: "item" + (href === cur ? " active" : ""), href, "aria-current": href === cur ? "page" : null },
      el("span", { class: "label" }, label), extra, c ? el("span", { class: "dot " + c.change, title: `${c.change}, not published` }) : "");
  };
  const group = (kind, items) => el("div", { class: "rail-group" },
    el("div", { class: "rail-head" }, el("h2", {}, el("a", { href: `#/${KIND[kind].route}`, style: "color:inherit;text-decoration:none" }, KIND[kind].many)),
      el("button", { class: "btn small ghost", onclick: () => go(KIND[kind].route, "new"), "aria-label": `New ${KIND[kind].one.toLowerCase()}` }, "+ New")),
    items.length ? items.map((it) => link(itemHref(kind, it.id), kind === "procedure" ? it.name : it.id, kind, it.id,
      it.locked ? el("span", { class: "lock", title: "Locked: every agent includes it" }, "locked") : "")) : el("div", { class: "empty" }, "None yet"));
  if (S.legacy) return $("rail").replaceChildren(el("div", { class: "rail-group" }, link("#/releases", "Releases")));
  $("rail").replaceChildren(
    el("div", { class: "rail-group" }, link("#/overview", "Overview")),
    group("agent", S.cfg.agents),
    group("instruction", S.cfg.instructions),
    group("procedure", [...S.cfg.procedures].sort((a, b) => a.name.localeCompare(b.name))),
    group("group", S.cfg.groups),
    el("div", { class: "rail-group" },
      link("#/settings", "Settings", "settings", "settings"),
      link("#/releases", "Releases", null, null, S.draft && S.draft.release ? el("span", { class: "tag live" }, `#${S.draft.release} live`) : "")));
}

function page(wide, ...kids) { $("main").replaceChildren(el("div", { class: "page" + (wide ? " wide" : "") }, ...kids)); window.scrollTo(0, 0); }
function flash() {
  const f = S.flash; S.flash = null;
  return f ? el("div", { class: "banner " + f.type, role: "status" }, f.text) : "";
}

function render() {
  if (!S.cfg) return;
  renderTop(); renderRail();
  const r = route();
  S.form = null;
  if (S.legacy && !["releases"].includes(r.section)) return migratePage();
  if (r.section === "overview") return matrixPage();
  if (r.section === "agents") return r.id ? agentPage(r.id, r.tab) : listPage("agent");
  if (r.section === "instructions") return r.id ? instructionPage(r.id, r.tab) : listPage("instruction");
  if (r.section === "procedures") return r.id ? procedurePage(r.id, r.tab) : listPage("procedure");
  if (r.section === "groups") return r.id ? groupPage(r.id, r.tab) : listPage("group");
  if (r.section === "settings") return settingsPage(r.id);
  if (r.section === "releases") return r.id ? releasePage(+r.id) : releasesPage();
  if (r.section === "changes") return changesPage();
  return homePage();
}

function issueList(issues, here) {
  return el("ul", {}, issues.map((i) => {
    const elsewhere = i.kind && KIND[i.kind] && !(here && i.kind === here.kind && i.id === here.id);
    return el("li", {}, elsewhere ? [el("a", { href: itemHref(i.kind, i.id) }, i.kind === "settings" ? "Settings" : `${KIND[i.kind].one} ${itemName(i.kind, i.id)}`), ": "] : "", i.text || i.message);
  }));
}
function errorBanner(e, lead = "This change can't be saved yet:") {
  const issues = e.data && e.data.issues;
  if (!issues || !issues.length) return el("div", { class: "banner err", role: "alert" }, e.message);
  return el("div", { class: "banner err", role: "alert" }, lead, issueList(issues));
}

// ---------------------------------------------------------------------------------
// forms
function makeForm(kind, id, model, isNew) {
  S.form = { kind, id, model, isNew, dirty: false, hash: location.hash, errors: [], rerender: null, onChange: [] };

}
function touch(f) {

}
const errsFor = (f, key, index) => f.errors.filter((i) => i.field === key && (index === undefined ? i.index === null || i.index === undefined : i.index === index));

  const bad = errsFor(f, key).some((i) => i.severity !== "warning");
  return el("div", { class: "field" + (bad ? " bad" : ""), "data-field": key },
    el("label", { class: "name", for: `f-${key}` }, name), help ? el("p", { class: "help" }, help) : "", control, errNodes(f, key));
}
function input(f, key, attrs = {}) {
  return el("input", { id: `f-${key}`, value: f.model[key] ?? "", oninput: (e) => { f.model[key] = e.target.value; touch(f); }, ...attrs });
}
function area(f, key, attrs = {}) {
  return el("textarea", { id: `f-${key}`, value: f.model[key] ?? "", oninput: (e) => { f.model[key] = e.target.value; touch(f); }, ...attrs });
}
function toggle(f, key, label) {
  return el("label", { class: "check" }, el("span", { class: "switch" },
    el("input", { type: "checkbox", id: `f-${key}`, checked: !!f.model[key], onchange: (e) => { f.model[key] = e.target.checked; touch(f); } }), el("span")), label);
}
function choose(f, key, options, after) {
  return el("select", { id: `f-${key}`, onchange: (e) => { f.model[key] = e.target.value; touch(f); if (after) after(); } },
    options.map(([v, label]) => el("option", { value: v, selected: f.model[key] === v }, label)));
}

// Name/value rows. Rows keep their own order and blanks while editing; the model is rebuilt from them.
function varRows(f, key, placeholder) {
  const box = el("div", { id: `f-${key}` });
  const rows = Object.entries(f.model[key] || {}).map(([k, v]) => ({ k, v }));
  const sync = () => { const out = {}; rows.forEach((r) => { if (r.k.trim()) out[r.k.trim()] = r.v; }); f.model[key] = out; touch(f); };
  const draw = () => {
    const names = rows.map((r) => r.k.trim());
    box.replaceChildren(
      el("div", { class: "rows" }, rows.map((r, i) => {
        const dup = r.k.trim() && names.indexOf(r.k.trim()) !== i;

          dup ? el("div", { class: "ferr" }, "This name is used twice; the last value wins.") : "");
      })),
      el("button", { class: "btn small addrow", type: "button", onclick: () => { rows.push({ k: "", v: "" }); draw(); box.querySelector(".row:last-child input").focus(); } }, "+ Add variable"));
  };
  draw();
  return box;
}

// An agent's variables: the ones its blocks need come first (unset ones highlighted), then any others it sets.
function agentVars(f) {
  const box = el("div", { id: "f-variables" });
  const defaults = S.cfg.settings.variables;
  let rows = Object.entries(f.model.variables || {}).map(([k, v]) => ({ k, v, fixed: false }));
  const sync = () => {
    const out = {};
    rows.forEach((r) => { const k = r.k.trim(); if (k && !(r.fixed && r.v === "")) out[k] = r.v; });
    f.model.variables = out; touch(f);
  };
  const draw = () => {
    const need = new Map(neededVariables(f.model));
    // Needed names without a row get one, fixed to that name; fixed rows nobody needs any more go away.
    rows = rows.filter((r) => !r.fixed || need.has(r.k) || r.v !== "");
    for (const name of need.keys()) if (!rows.some((r) => r.k.trim() === name)) rows.push({ k: name, v: "", fixed: true });
    const order = (r) => (need.has(r.k.trim()) ? [...need.keys()].indexOf(r.k.trim()) : 1e6);

    const names = rows.map((r) => r.k.trim());
    const unset = rows.filter((r) => need.has(r.k.trim()) && r.v === "" && !(r.k.trim() in defaults));
    box.replaceChildren(
      unset.length ? el("div", { class: "fwarn", style: "margin:0 0 8px" }, `${plural(unset.length, "variable needs", "variables need")} a value: the prompt can't be built without ${unset.length === 1 ? "it" : "them"}.`) : "",
      el("div", { class: "rows" }, rows.map((r, i) => {
        const name = r.k.trim();
        const from = need.get(name);
        const missing = from && r.v === "" && !(name in defaults);
        const dup = name && names.indexOf(name) !== i;
        return el("div", { class: "row vars" + (missing || dup ? " bad" : "") },
          r.fixed ? el("span", { class: "varname" }, el("code", {}, `{{${name}}}`)) : el("input", { value: r.k, placeholder: "name", "aria-label": "Variable name", oninput: (e) => { r.k = e.target.value; sync(); } }),
          el("input", { value: r.v, placeholder: name in defaults ? `Default: ${defaults[name]}` : missing ? "Needs a value" : "value", "aria-label": `Value of ${name || "variable"}`,
            oninput: (e) => { r.v = e.target.value; sync(); const row = e.target.closest(".row"); row.classList.toggle("bad", !!from && r.v === "" && !(name in defaults)); } }),
          r.fixed ? el("span") : el("button", { class: "btn icon-btn", type: "button", "aria-label": `Remove ${name || "variable"}`, onclick: () => { rows.splice(i, 1); sync(); draw(); } }, "×"),
          el("div", { class: "note varfrom" }, from ? `Used by ${from.join(", ")}` : name ? "No block uses it" : ""),
          dup ? el("div", { class: "ferr" }, "This name is used twice; the last value wins.") : "");
      })),
      el("button", { class: "btn small addrow", type: "button", onclick: () => { rows.push({ k: "", v: "", fixed: false }); draw(); box.querySelector(".row:last-of-type input").focus(); } }, "+ Add variable"));
  };
  f.redrawVars = draw;
  draw();
  return box;
}

// Ordered rows of text with an optional tool, and "required" for steps.
function stepRows(f, key, { steps = false, placeholder, noun }) {
  const box = el("div", { id: `f-${key}` });
  const draw = () => {
    const list = f.model[key];
    const move = (i, d) => { list.splice(i + d, 0, list.splice(i, 1)[0]); touch(f); draw(); };
    box.replaceChildren(
      el("div", { class: "rows" }, list.map((s, i) => el("div", { class: "row " + (steps ? "steps" : "items") + (errsFor(f, key, i).length ? " bad" : "") },
        steps ? el("span", { class: "num" }, `${i + 1}.`) : "",
        el("input", { value: s.text, placeholder, "aria-label": `${noun} ${i + 1}`, oninput: (e) => { s.text = e.target.value; touch(f); } }),
        el("input", { class: "tool", value: s.tool || "", placeholder: "Tool (optional)", "aria-label": `Tool for ${noun.toLowerCase()} ${i + 1}`, oninput: (e) => { s.tool = e.target.value.trim() || null; touch(f); } }),

  const blocks = (ids) => ids.length ? ["Blocks:", ...ids.map((b, i) => `  ${i + 1}. ${blockName(b)}${blockKind(b) ? ` (${KIND[blockKind(b)].badge})` : ""}`)] : ["Blocks: none"];
  const vars = (title, v) => Object.keys(v).length ? [title, ...Object.entries(v).map(([k, x]) => `  ${k} = ${x}`)] : [`${title} none`];

async function createWorkspace() {
