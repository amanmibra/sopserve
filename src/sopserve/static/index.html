<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sopserve</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --sunk: #eef1f4; --ink: #1b2230; --muted: #5e6878; --line: #dde1e7; --line-strong: #c5ccd6;
    --accent: #0f6e6a; --accent-soft: #e2f1ef; --accent-ink: #ffffff;
    --ok: #2e7d4f; --warn: #a15c07; --warn-soft: #fbf0df; --err: #b42318; --err-soft: #fbe9e7;
    --radius: 8px; --focus: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --panel: #1a2028; --sunk: #151a21; --ink: #e6eaf0; --muted: #93a0b0; --line: #2a323d; --line-strong: #3a4552;
      --accent: #4fc1b9; --accent-soft: #173431; --accent-ink: #0d1a19;
      --ok: #6cc597; --warn: #e6a94f; --warn-soft: #2f2616; --err: #f08a7e; --err-soft: #35201e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --panel: #1a2028; --sunk: #151a21; --ink: #e6eaf0; --muted: #93a0b0; --line: #2a323d; --line-strong: #3a4552;
    --accent: #4fc1b9; --accent-soft: #173431; --accent-ink: #0d1a19;
    --ok: #6cc597; --warn: #e6a94f; --warn-soft: #2f2616; --err: #f08a7e; --err-soft: #35201e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: none; box-shadow: var(--focus); }

  /* frame */
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  .brand { font-weight: 650; font-size: 15px; letter-spacing: -.01em; margin-right: 6px; }
  .spacer { flex: 1; }
  .shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: calc(100vh - 55px); }
  nav.rail { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px 40px; position: sticky; top: 55px; height: calc(100vh - 55px); overflow: auto; }
  main { padding: 24px 32px 40px; min-width: 0; }
  .page { max-width: 860px; }
  .page.wide { max-width: 1320px; }

  /* rail */
  .rail-group { margin-bottom: 18px; }
  .rail-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 4px; }
  .rail-head h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--muted); }
  .rail a.item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; min-width: 0; }
  .rail a.item:hover { background: var(--sunk); }
  .rail a.item.active { background: var(--accent-soft); }
  .rail a.item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail .empty { padding: 2px 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
  .dot.deleted { background: var(--err); }

  /* controls */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--sunk); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 550; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--err); }
  .btn.small { padding: 2px 8px; font-size: 13px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); background: var(--sunk); }
  .btn:disabled { opacity: .45; cursor: default; filter: none; }
  .icon-btn { width: 28px; height: 28px; padding: 0; justify-content: center; border-color: transparent; background: transparent; color: var(--muted); }
  .icon-btn:hover:not(:disabled) { background: var(--sunk); color: var(--ink); }
  .count { background: var(--warn); color: var(--panel); border-radius: 10px; padding: 0 7px; font-size: 12px; font-weight: 650; }
  input:not([type]), input[type=text], select, textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); }
  input[readonly] { background: var(--sunk); color: var(--muted); }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  textarea.tall { min-height: 200px; }
  .top select, .top input { width: auto; }
  label.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: var(--line-strong); border-radius: 20px; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; background: var(--panel); border-radius: 50%; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { box-shadow: var(--focus); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; flex-wrap: wrap; }
  .seg button { border: 0; background: var(--panel); padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }

  /* page parts */
  .crumb { font-size: 13px; margin-bottom: 2px; }
  .crumb a { color: var(--muted); }
  h1 { font-size: 22px; line-height: 1.25; margin: 0; letter-spacing: -.015em; font-weight: 650; }
  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .sub { color: var(--muted); margin: 4px 0 18px; max-width: 75ch; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 12px 0 22px; }
  .tabs a { padding: 8px 12px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a.on { color: var(--ink); border-color: var(--accent); font-weight: 550; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; text-decoration: none; }
  .tag.changed, .tag.added, .tag.edited { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .tag.removed, .tag.deleted { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .tag.live { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  .form { display: grid; gap: 24px; }
  .field > .name { display: block; font-weight: 600; margin-bottom: 2px; }
  .field > .help { color: var(--muted); font-size: 13px; margin: 0 0 8px; max-width: 72ch; }
  .field.bad > input, .field.bad > textarea, .field.bad > select, .row.bad input:not([type=checkbox]) { border-color: var(--err); }
  .ferr { color: var(--err); font-size: 13px; margin-top: 6px; }
  .fwarn { color: var(--warn); font-size: 13px; margin-top: 6px; }
  .pair { display: grid; grid-template-columns: 200px 1fr; gap: 12px; }

  /* lists of rows */
  .rows { display: grid; gap: 6px; }
  .row { display: grid; gap: 6px; align-items: center; }
  .row.steps { grid-template-columns: 26px 1fr 170px auto auto; }
  .row.items { grid-template-columns: 1fr 170px auto; }
  .row.vars { grid-template-columns: minmax(120px, 220px) 1fr auto; }
  .row .num { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .row .ops { display: flex; }
  .row .ferr { grid-column: 1 / -1; margin: 0 0 4px; }
  .row.steps .ferr { grid-column: 2 / -1; }
  .addrow { margin-top: 8px; }

  .picker { display: grid; gap: 6px; justify-items: start; }
  .picked { display: flex; flex-wrap: wrap; gap: 6px; }
  .picked.ordered { display: grid; gap: 4px; justify-self: stretch; max-width: 520px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border-radius: 16px; background: var(--sunk); border: 1px solid var(--line); }
  .picked.ordered .chip { border-radius: var(--radius); padding: 3px 4px 3px 10px; justify-content: space-between; }
  .chip .x { width: 24px; height: 24px; }
  .chip .muted { margin-left: 6px; font-size: 13px; }
  .picker select { width: auto; min-width: 220px; }
  .note { color: var(--muted); font-size: 13px; }
  .muted { color: var(--muted); }

  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: sticky; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); padding: 12px 0; margin-top: 26px; border-top: 1px solid var(--line); }
  .actions input { max-width: 320px; }
  .banner { padding: 10px 14px; border-radius: var(--radius); margin: 0 0 16px; background: var(--sunk); border: 1px solid var(--line); }
  .banner.ok { background: var(--accent-soft); border-color: transparent; }
  .banner.err { background: var(--err-soft); border-color: transparent; }
  .banner.warn { background: var(--warn-soft); border-color: transparent; }
  .banner ul { margin: 6px 0 0; padding-left: 18px; }
  .banner a { color: inherit; font-weight: 600; }

  table.list { width: 100%; border-collapse: collapse; }
  table.list td, table.list th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.list th { font-weight: 600; color: var(--muted); font-size: 13px; }
  table.list tr.click { cursor: pointer; }
  table.list tr.click:hover td, table.list tr.on td { background: var(--sunk); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 16px; margin: 0 0 8px; }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .prompt { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
  .prompt header { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .prompt header b { margin-right: auto; }
  .prompt pre { margin: 0; padding: 14px; white-space: pre-wrap; word-break: break-word; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 70vh; overflow: auto; }
  .parts { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--sunk); }
  .parts .tag { background: var(--panel); color: var(--ink); }
  .history { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
  .diff { font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 0; white-space: pre-wrap; word-break: break-word; }
  .diff div { padding: 0 14px; }
  .diff .plus { background: color-mix(in srgb, var(--ok) 16%, transparent); }
  .diff .minus { background: color-mix(in srgb, var(--err) 13%, transparent); color: var(--muted); text-decoration: line-through; }
  .empty-state { padding: 40px 0; max-width: 60ch; }
  .empty-state h1 { margin-bottom: 8px; }
  .hidden { display: none !important; }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    nav.rail { border-right: 0; border-bottom: 1px solid var(--line); position: static; height: auto; }
    main { padding: 18px 16px 40px; }
    .compare, .pair, .history { grid-template-columns: 1fr; }
    .row.steps { grid-template-columns: 22px 1fr auto; }
    .row.items { grid-template-columns: 1fr auto; }
    .row.steps .tool, .row.items .tool { grid-column: 2 / 3; }
    .row.vars { grid-template-columns: 1fr auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="top">
  <span class="brand">sopserve</span>
  <select id="ws" aria-label="Workspace"></select>
  <span id="new-ws-box" class="hidden"><input id="new-ws" placeholder="Workspace name" size="18" aria-label="New workspace name"> <button class="btn small" id="new-ws-ok">Create</button> <button class="btn small ghost" id="new-ws-cancel">Cancel</button></span>
  <button class="btn small ghost" id="new-ws-btn">New workspace</button>
  <span class="spacer"></span>
  <input id="author" placeholder="Your name" size="14" aria-label="Your name, recorded with changes">
  <button class="btn" id="changes-btn">Unpublished changes</button>
  <button class="btn icon-btn" id="theme" title="Switch between light and dark" aria-label="Switch between light and dark">◐</button>
</div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Workspace contents"></nav>
  <main id="main"><div class="page"><p class="muted">Loading…</p></div></main>
</div>
<script>
"use strict";
// ---------------------------------------------------------------------------------
// helpers
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (["value", "checked", "disabled", "readOnly", "selected"].includes(k)) n[k] = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false && kid !== "") n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return n;
}
const local = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
};
const clone = (x) => JSON.parse(JSON.stringify(x));
const when = (t) => t ? new Date(t).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";
const slug = (s) => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 100);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

const KIND = {
  agent: { one: "Agent", many: "Agents", route: "agents", list: "agents", api: "agents" },
  base: { one: "Shared instruction", many: "Shared instructions", route: "shared", list: "bases", api: "bases" },
  procedure: { one: "Procedure", many: "Procedures", route: "procedures", list: "procedures", api: "procedures" },
  settings: { one: "Settings", many: "Settings", route: "settings", list: null, api: null },
};
const PLATFORMS = [["livekit", "LiveKit", "Agent name"], ["vapi", "Vapi", "Assistant ID"], ["elevenlabs", "ElevenLabs", "Agent ID"], ["retell", "Retell", "Agent ID"]];
const platformName = (p) => (PLATFORMS.find((x) => x[0] === p) || [p, p])[1];
const DELIVERY = [
  ["prompt", "Whole procedure in the prompt", "Everything goes in the agent's prompt. Use this unless the agent has a get_sop tool."],
  ["auto", "Rules in the prompt, steps on request", "The name, when it applies, never and warning signs stay in the prompt. The goal, guidance and steps are fetched with the agent's get_sop tool."],
  ["tool", "Only the name in the prompt, the rest on request", "The prompt names the procedure and when it applies. Everything else is fetched with the agent's get_sop tool."],
];

// ---------------------------------------------------------------------------------
// state and API
const S = { ws: local.get("sopserve.ws") || "", workspaces: [], cfg: null, draft: null, releases: [], releaseCache: {}, form: null, flash: null };

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = (res.headers.get("content-type") || "").includes("json") ? await res.json() : await res.text();
  if (!res.ok) {
    const detail = data && data.detail;
    const err = new Error(typeof detail === "string" ? detail.charAt(0).toUpperCase() + detail.slice(1) + "." : Array.isArray(detail) ? "Some values are missing or have the wrong type." : `The server answered ${res.status}.`);
    err.status = res.status; err.data = data; throw err;
  }
  return data;
}
const wsUrl = (p = "") => `/v1/workspaces/${encodeURIComponent(S.ws)}${p}`;
const author = () => $("author").value.trim() || null;

async function loadAll() {
  const [cfg, draft, releases] = await Promise.all([api("GET", wsUrl("/config")), api("GET", wsUrl("/draft")), api("GET", wsUrl("/releases"))]);
  S.cfg = cfg; S.draft = draft; S.releases = releases;
}
async function liveRelease() {
  const n = S.draft && S.draft.release;
  if (!n) return null;
  if (!S.releaseCache[n]) S.releaseCache[n] = await api("GET", wsUrl(`/releases/${n}`));
  return S.releaseCache[n];
}
function itemName(kind, id) {
  if (kind === "settings" || kind === "config") return "Settings";
  if (kind === "procedure" || kind === "sop") { const p = S.cfg && S.cfg.procedures.find((x) => x.id === id); return p ? p.name : id; }
  return id;
}
const itemHref = (kind, id) => kind === "settings" ? "#/settings" : `#/${KIND[kind].route}/${encodeURIComponent(id)}`;
const changeOf = (kind, id) => S.draft && S.draft.items.find((i) => i.kind === kind && i.id === id);
const kindOfComponent = (k) => ({ agent: "agent", base: "base", sop: "procedure", config: "settings" }[k]);

// ---------------------------------------------------------------------------------
// routing: #/agents/<id>[/prompt|/history], #/shared/<id>, #/procedures/<id>, #/settings, #/changes, #/releases/<n>
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  return { section: parts[0] || "", id: parts[1] || "", tab: parts[2] || "" };
}
function go(...parts) {
  const hash = "#/" + parts.filter((p) => p !== undefined && p !== "").map((p) => encodeURIComponent(p)).join("/");
  if (location.hash === hash) render(); else location.hash = hash;
}
// Leaving a form with unsaved edits asks inline, not with a browser dialog.
window.addEventListener("hashchange", () => {
  if (S.form && S.form.dirty && S.form.hash !== location.hash) {
    const target = location.hash;
    history.replaceState(null, "", S.form.hash);
    const bar = $("leave-bar");
    if (bar) {
      bar.classList.remove("hidden");
      bar.querySelector("[data-leave]").onclick = () => { S.form.dirty = false; location.hash = target; };
      bar.scrollIntoView({ block: "nearest" });
    }
    return;
  }
  render();
});

// ---------------------------------------------------------------------------------
// frame
function renderTop() {
  const names = S.workspaces.map((w) => w.workspace);
  if (S.ws && !names.includes(S.ws)) names.push(S.ws);
  $("ws").replaceChildren(...(names.length ? names.map((n) => el("option", { value: n, selected: n === S.ws }, n)) : [el("option", { value: "" }, "No workspaces yet")]));
  const n = S.draft ? S.draft.items.length : 0;
  $("changes-btn").replaceChildren("Unpublished changes", n ? el("span", { class: "count", "aria-label": `${n} changes` }, n) : "");
}

function renderRail() {
  const r = route();
  if (!S.cfg) { $("rail").replaceChildren(); return; }
  const cur = "#/" + r.section + (r.id && !["settings", "releases"].includes(r.section) ? "/" + encodeURIComponent(r.id) : "");
  const link = (href, label, kind, id, extra) => {
    const c = kind && changeOf(kind, id);
    return el("a", { class: "item" + (href === cur ? " active" : ""), href, "aria-current": href === cur ? "page" : null },
      el("span", { class: "label" }, label), extra, c ? el("span", { class: "dot " + c.change, title: `${c.change}, not published` }) : "");
  };
  const group = (kind, items) => el("div", { class: "rail-group" },
    el("div", { class: "rail-head" }, el("h2", {}, el("a", { href: `#/${KIND[kind].route}`, style: "color:inherit;text-decoration:none" }, KIND[kind].many)),
      el("button", { class: "btn small ghost", onclick: () => go(KIND[kind].route, "new"), "aria-label": `New ${KIND[kind].one.toLowerCase()}` }, "+ New")),
    items.length ? items.map((it) => link(itemHref(kind, it.id), kind === "procedure" ? it.name : it.id, kind, it.id)) : el("div", { class: "empty" }, "None yet"));
  $("rail").replaceChildren(
    group("agent", S.cfg.agents),
    group("base", S.cfg.bases),
    group("procedure", [...S.cfg.procedures].sort((a, b) => a.name.localeCompare(b.name))),
    el("div", { class: "rail-group" },
      link("#/settings", "Settings", "settings", "settings"),
      link("#/releases", "Releases", null, null, S.draft && S.draft.release ? el("span", { class: "tag live" }, `#${S.draft.release} live`) : "")));
}

function page(wide, ...kids) { $("main").replaceChildren(el("div", { class: "page" + (wide ? " wide" : "") }, ...kids)); window.scrollTo(0, 0); }
function flash() {
  const f = S.flash; S.flash = null;
  return f ? el("div", { class: "banner " + f.type, role: "status" }, f.text) : "";
}

function render() {
  if (!S.cfg) return;
  renderTop(); renderRail();
  const r = route();
  S.form = null;
  if (r.section === "agents") return r.id ? agentPage(r.id, r.tab) : listPage("agent");
  if (r.section === "shared") return r.id ? basePage(r.id, r.tab) : listPage("base");
  if (r.section === "procedures") return r.id ? procedurePage(r.id, r.tab) : listPage("procedure");
  if (r.section === "settings") return settingsPage(r.id);
  if (r.section === "releases") return r.id ? releasePage(+r.id) : releasesPage();
  if (r.section === "changes") return changesPage();
  return homePage();
}

function issueList(issues, here) {
  return el("ul", {}, issues.map((i) => {
    const elsewhere = i.kind && KIND[i.kind] && !(here && i.kind === here.kind && i.id === here.id);

async function saveItem(f, data, note) {
  const body = { ...data, author: author(), note };
  const id = f.isNew ? data.id : f.id;
  if (f.kind !== "settings" && f.isNew && !/^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$/.test(id || "")) {
    f.errors = [{ field: "id", severity: "error", text: id ? "Use letters, digits, '-' and '_', starting with a letter or digit." : "Give it a name." }];
    return f.rerender(el("div", { class: "banner err", role: "alert" }, "Fix the highlighted fields, then save again."));
  }
  try {
    let res;
    if (f.kind === "settings") res = await api("PUT", wsUrl("/config/settings"), body);
    else if (f.isNew) res = await api("POST", wsUrl(`/config/${KIND[f.kind].api}`), body);
    else res = await api("PUT", wsUrl(`/config/${KIND[f.kind].api}/${encodeURIComponent(f.id)}`), body);
    f.dirty = false;
    S.flash = { type: "ok", text: res.changed.length ? (f.isNew ? "Created as a draft. Publish to send it to agents." : "Saved as a draft. Publish to send it to agents.") : "Nothing changed." };
    await loadAll();
    if (f.kind === "settings") go("settings"); else go(KIND[f.kind].route, res.item.id);
  } catch (e) {
    const issues = (e.data && e.data.issues) || [];
    f.errors = issues.filter((i) => (i.kind === f.kind && (f.kind === "settings" || i.id === id)) || (!i.kind && i.field === "id"));
    const others = issues.filter((i) => !f.errors.includes(i));
    f.rerender(others.length || !issues.length
      ? errorBanner(others.length ? { data: { issues: others } } : e, f.errors.length ? "Fix the highlighted fields. This change also causes problems elsewhere:" : "This change can't be saved, because:")
      : el("div", { class: "banner err", role: "alert" }, "Fix the highlighted fields, then save again."));
    const first = document.querySelector(".field.bad, .row.bad, .ferr");
    if (first) first.scrollIntoView({ block: "center" });
  }
}

    f.dirty = false;
    S.flash = { type: "ok", text: `Deleted ${itemName(f.kind, f.id)} in the draft, and removed it from everything that named it. Publish to make it final.` };

// --- history
function readable(kind, it) {

  const list = (title, items, numbered) => items.length ? [title, ...items.map((s, i) => `  ${numbered ? `${i + 1}.` : "-"} ${s.text}${s.tool ? `  [tool: ${s.tool}${s.required ? ", required" : ""}]` : ""}`)] : [];
  const to = (a, ex) => (a === "*" ? "all agents" : a.length ? a.join(", ") : kind === "base" ? "agents that include it" : "no agents") + (ex.length ? `, except ${ex.join(", ")}` : "");
  const vars = (title, v) => Object.keys(v).length ? [title, ...Object.entries(v).map(([k, x]) => `  ${k} = ${x}`)] : [`${title} none`];
  const block = (title, t) => t ? [title, ...t.replace(/\n+$/, "").split("\n").map((l) => "  " + l)] : [`${title} (empty)`];
  if (kind === "agent") return [`Platform: ${platformName(it.platform)}, ${it.platform_id}`, `Shared instructions: ${it.inherits.join(", ") || "none"}`, ...vars("Variables:", it.variables), ...block("Instructions:", it.instructions), `Skips: ${it.exclude.map((x) => itemName(S.cfg.procedures.some((p) => p.id === x) ? "procedure" : "base", x)).join(", ") || "nothing"}`];
  if (kind === "base") return [...block("Text:", it.text), `Applies to: ${to(it.agents, it.exclude)}`, `Includes: ${it.inherits.join(", ") || "nothing"}`, `Position: ${it.position}`, `Locked: ${it.locked ? "yes" : "no"}`];
  if (kind === "procedure") return [`Name: ${it.name}`, `Goal: ${it.goal}`, `When: ${it.when}`, ...block("Guidance:", it.guidance), ...list("Steps:", it.steps, true), ...list("Never:", it.never), ...list("Warning signs:", it.warning_signs), `Applies to: ${to(it.agents, it.exclude)}`, `Delivery: ${(DELIVERY.find((d) => d[0] === it.delivery) || [0, it.delivery])[1]}`, `Locked: ${it.locked ? "yes" : "no"}`];
  return [...vars("Default variables:", it.variables), `Procedures heading: ${it.procedures_heading}`, `Procedures first: ${it.procedure_order.map((p) => itemName("procedure", p)).join(", ") || "none"}`];
}
function lineDiff(a, b) {
  const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { out.push([" ", a[i]]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out.push(["-", a[i++]]); else out.push(["+", b[j++]]); }
  while (i < n) out.push(["-", a[i++]]);

}
async function historyPage(kind, id, item, chosenIndex) {

    el("div", { class: "history" },

        el("td", {}, el("div", {}, el("b", {}, `Version ${hist.length - i}`), " ",

      el("div", {},

function restore(kind, id, old, label) {

        el("td", {}, el("b", {}, a.agent)), el("td", { class: "muted" }, a.platform_ref),
        el("td", {}, el("span", { class: "tag " + a.status }, { added: "New agent", changed: "Prompt changes", removed: "Removed" }[a.status])),
        el("td", { class: "note" }, a.status === "removed" ? "" : "Compare prompts")))) : d.items.length ? el("p", { class: "note" }, "The saved edits don't change what any agent is told.") : ""),

function releasesPage() {

        el("td", { class: "note" }, when(r.created_at), r.author ? `, ${r.author}` : ""), el("td", {}, r.current ? el("span", { class: "tag live" }, "live") : ""))))

function itemOfPath(path) {

}

  renderTop();

    el("p", {}, "A workspace holds your agents with their shared instructions and procedures. Use New workspace at the top to start one.")));
}

const wsBox = (open) => { $("new-ws-box").classList.toggle("hidden", !open); $("new-ws-btn").classList.toggle("hidden", open); if (open) $("new-ws").focus(); };

async function createWorkspace() {
  const name = $("new-ws").value.trim();
  if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/.test(name)) { $("new-ws").setCustomValidity("Use letters, digits, '.', '_' and '-'."); $("new-ws").reportValidity(); return; }
  $("new-ws").setCustomValidity(""); $("new-ws").value = ""; wsBox(false);
  if (!S.workspaces.some((w) => w.workspace === name)) S.workspaces.push({ workspace: name, current_release: null });
  history.replaceState(null, "", "#/");

}
